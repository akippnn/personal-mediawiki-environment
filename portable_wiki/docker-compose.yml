services:
  mediawiki:
    image: mediawiki:latest
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./data:/var/www/data:ro
      - mediawiki_data:/var/www/html/images
    environment:
      - MW_DB_HOST=database
      - MW_DB_USER=wikiuser
      - MW_DB_PASSWORD=wikipass
      - MW_DB_NAME=my_wiki
      - MW_ADMIN_USER=admin
      - MW_ADMIN_PASS=adminpassword
      - MW_SITE_NAME=PortableWiki
      - MW_ENABLE_UPLOADS=1
    depends_on:
      - database
    links:
      - database

  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=my_wiki
      - MYSQL_USER=wikiuser
      - MYSQL_PASSWORD=wikipass
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  mediawiki_data:
