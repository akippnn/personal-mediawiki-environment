[project]
name = "portable-mediawiki-editor"
version = "0.1.0"
description = "Clone, edit, and sync MediaWiki sites locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mwparserfromhell>=0.7.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
pme = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exporter", "tools"]
